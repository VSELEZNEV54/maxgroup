name: Max Group · Next.js и Django
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Запустить проект с изолированными локальными реквизитами
        run: make up
      - name: Проверить модели, миграции и страницы Next.js
        run: make test
      - name: Сверить публичные адреса через Nginx
        run: make check-urls
