[project]
name = "maxgroup-site"
version = "0.1.0"
description = "Сайт, каталог и заявки Max Group"
requires-python = ">=3.13,<3.14"
dependencies = [
    "Django>=5.2,<5.3",
    "wagtail>=7.4,<7.5",
    "psycopg[binary]>=3.2,<4",
    "celery[redis]>=5.5,<6",
    "gunicorn>=23,<27",
    "beautifulsoup4>=4.12,<5",
    "lxml>=5.3,<7",
    "requests>=2.32,<3",
    "django-storages[s3]>=1.14,<2",
]

[tool.uv]
package = false
