name: maxgroup-local

x-app: &app
  image: maxgroup-app:local
  build:
    context: .
    target: app
  env_file: .env
  volumes:
    - uploads:/srv/media
    - static:/srv/static:ro

services:
  chat-model:
    image: ghcr.io/ggml-org/llama.cpp:server@sha256:b24873ae66a4732e0b4b66dd7dc658066ccad6e8c63524278e92eebc767aacbe
    restart: unless-stopped
    command:
      - --model-url
      - https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/91cad51170dc346986eccefdc2dd33a9da36ead9/qwen2.5-1.5b-instruct-q4_k_m.gguf
      - --model
      - /models/qwen2.5-1.5b.gguf
      - --alias
      - maxgroup
      - --host
      - 0.0.0.0
      - --port
      - '8080'
      - --ctx-size
      - '4096'
      - --threads
      - '4'
    volumes:
      - chat-models:/models
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: maxgroup
      POSTGRES_USER: maxgroup
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Создайте .env командой make init}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maxgroup -d maxgroup"]
      interval: 3s
      timeout: 3s
      retries: 30
  broker:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - broker:/data
  cache:
    image: redis:7-alpine
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
  setup:
    <<: *app
    volumes:
      - uploads:/srv/media
      - static:/srv/static
    depends_on:
      db: {condition: service_healthy}
    command: ["sh", "-ec", "python manage.py migrate --noinput && python manage.py collectstatic --noinput --verbosity 0 && python manage.py sync_site && python manage.py prepare_roles && python manage.py local_admin"]
  web:
    <<: *app
    restart: unless-stopped
    depends_on:
      setup: {condition: service_completed_successfully}
      cache: {condition: service_started}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/',timeout=2)"]
      interval: 10s
      timeout: 4s
      retries: 15
  worker-crm:
    <<: *app
    restart: unless-stopped
    depends_on:
      setup: {condition: service_completed_successfully}
      broker: {condition: service_started}
    command: celery -A backend worker -Q crm -l INFO --concurrency=2
  worker-import:
    <<: *app
    restart: unless-stopped
    depends_on:
      setup: {condition: service_completed_successfully}
      broker: {condition: service_started}
    command: celery -A backend worker -Q imports -l INFO --concurrency=1
  beat:
    <<: *app
    restart: unless-stopped
    depends_on:
      setup: {condition: service_completed_successfully}
      broker: {condition: service_started}
    command: celery -A backend beat -l INFO --schedule=/tmp/celerybeat
  frontend:
    image: maxgroup-next:local
    build: ./frontend
    environment:
      CMS_ORIGIN: http://web:8000
    depends_on:
      web: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 20
    restart: unless-stopped
  nginx:
    image: maxgroup-nginx:local
    build:
      context: .
      target: proxy
    ports:
      - "127.0.0.1:${SITE_PORT:-8000}:80"
    volumes:
      - static:/srv/static:ro
      - uploads:/srv/media:ro
    depends_on:
      frontend: {condition: service_healthy}
    restart: unless-stopped

volumes:
  chat-models:
  postgres:
  uploads:
  static:
  broker:
