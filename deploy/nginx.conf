map $request_method $page_preview {
    default http://web:8000;
    GET http://frontend:3000;
    HEAD http://frontend:3000;
}
server {
    listen 80;
    server_name _;
    charset utf-8;
    client_max_body_size 128m;
    gzip on;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml;
    root /srv/release;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $cms http://web:8000;
    set $frontend http://frontend:3000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Original-URI $request_uri;
    location ~ ^/(assets|kvizy/assets|model-media)/ {
        try_files $uri =404;
        expires 1h;
    }
    location /static/ { alias /srv/static/; }
    location ^~ /media/documents/ { return 404; }
    location ^~ /_documents/ {
        internal;
        alias /srv/media/documents/;
        add_header X-Content-Type-Options nosniff;
    }
    location /media/ {
        alias /srv/media/;
        add_header X-Content-Type-Options nosniff;
    }
    location ~ ^/admin/pages/(?:[0-9]+/(?:edit/preview|view_draft|revisions/[0-9]+/view)|add/website/sitepage/[0-9]+/preview|workflow/preview/[0-9]+/[0-9]+)/$ {
        proxy_pass $page_preview;
    }
    location ~ ^/(admin|api|documents|_util|model-inventory|health)(/|$) { proxy_pass $cms; }
    location ~ ^/(robots\.txt|sitemap\.xml|favicon\.ico|site\.webmanifest|llms\.txt)$ { proxy_pass $cms; }
    location / { proxy_pass $frontend; }
}
