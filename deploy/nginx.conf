server {
    listen 80;
    server_name _;
    charset utf-8;
    client_max_body_size 128m;
    gzip on;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml;
    root /srv/release;
    location ~ ^/(assets|kvizy/assets|model-media)/ {
        try_files $uri =404;
        expires 1h;
    }
    location /static/ { alias /srv/static/; }
    location ^~ /media/documents/ { return 404; }
    location ^~ /_documents/ {
        internal;
        alias /srv/media/documents/;
        add_header X-Content-Type-Options nosniff;
    }
    location /media/ {
        alias /srv/media/;
        add_header X-Content-Type-Options nosniff;
    }
    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
